<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CC0000; --red-dark:#990000; --red-soft:#FDECEC; --ink:#111214;
  --bg:#F3F3F5; --surface:#FFFFFF; --surface2:#F1F1F4; --text:#1B1B1F; --muted:#60606A; --outline:#E2E2E8;
  --ok:#188038; --ok-soft:#E6F4EA; --bad:#D93025; --bad-soft:#FCE8E6; --na:#5F6368; --na-soft:#ECEEF1;
  --warn:#B06000; --warn-soft:#FEF3E0; --info:#1A73E8; --info-soft:#E8F0FE;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 10px rgba(0,0,0,.05);
  --bar:58px; --nav:68px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D0D0F; --surface:#18181B; --surface2:#222226; --text:#ECECEF; --muted:#A1A1AA; --outline:#2C2C31;
  --red-soft:#3B1213; --ok-soft:#10301B; --bad-soft:#3A1513; --na-soft:#26282C; --warn-soft:#3A2A10; --info-soft:#132A4A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;font-variation-settings:'FILL' 0;user-select:none}
.ms.f{font-variation-settings:'FILL' 1}
.hidden{display:none!important}

/* ---------- App bar ---------- */
.appbar{position:fixed;top:0;left:0;right:0;height:var(--bar);background:var(--ink);color:#fff;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.appbar .title{flex:1;min-width:0;padding-left:8px}
.appbar .t1{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .t2{font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden}
.iconbtn:active{background:rgba(255,255,255,.14)}
.redline{position:fixed;top:var(--bar);left:0;right:0;height:3px;background:var(--red);z-index:29}
.progress{position:fixed;top:var(--bar);left:0;right:0;height:3px;z-index:31;overflow:hidden;opacity:0;transition:opacity .2s}
.progress.on{opacity:1}
.progress:before{content:'';position:absolute;height:100%;width:40%;background:#fff;animation:ind 1.1s infinite ease-in-out}
@keyframes ind{0%{left:-40%}100%{left:100%}}

/* ---------- Layout ---------- */
main{padding:calc(var(--bar) + 14px) 14px calc(var(--nav) + 96px);max-width:760px;margin:0 auto;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:500;white-space:nowrap}
.chip .ms{font-size:16px}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-na{background:var(--na-soft);color:var(--na)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-info{background:var(--info-soft);color:var(--info)} .c-red{background:var(--red-soft);color:var(--red)}

/* ---------- Buttons ---------- */
.btn{height:46px;border:0;border-radius:23px;padding:0 20px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;overflow:hidden;letter-spacing:.2px}
.btn.pri{background:var(--red);color:#fff}
.btn.pri:active{background:var(--red-dark)}
.btn.ton{background:var(--red-soft);color:var(--red)}
.btn.out{background:transparent;border:1px solid var(--outline);color:var(--text)}
.btn.wa{background:#1FA855;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .5s linear;background:currentColor;opacity:.18;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* ---------- Fields ---------- */
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--outline);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border .15s}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--surface2);color:var(--muted)}
.field.req label:after{content:' *';color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--surface);border-top:1px solid var(--outline);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.nav .pill{width:60px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav button.on{color:var(--text)}
.nav button.on .pill{background:var(--red-soft);color:var(--red)}
.nav button.on .ms{font-variation-settings:'FILL' 1}

/* ---------- FAB ---------- */
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px);height:56px;border-radius:18px;padding:0 22px 0 18px;border:0;background:var(--red);color:#fff;font-weight:500;font-size:15px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(204,0,0,.4);z-index:25;cursor:pointer;overflow:hidden}
.fab:active{background:var(--red-dark)}

/* ---------- Hero / ring ---------- */
.hero{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:19px;line-height:1.05}
.ring .v small{display:block;font-size:10.5px;font-weight:500;color:var(--muted)}
.hero h2{margin:0 0 2px;font-size:18px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.banner .ms{font-size:20px;margin-top:1px}

/* ---------- Checklist items ---------- */
.item{padding:0;overflow:hidden}
.item-head{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 14px;cursor:pointer;position:relative;overflow:hidden}
.num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.item.done .num{background:var(--ok);color:#fff} .item.missed .num{background:var(--bad);color:#fff} .item.na .num{background:var(--na);color:#fff}
.ih-title{font-weight:500;font-size:15px;line-height:1.25}
.ih-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.chev{transition:transform .2s;color:var(--muted)}
.item.open .chev{transform:rotate(180deg)}
.item-body{display:none;padding:0 14px 16px;border-top:1px solid var(--outline)}
.item.open .item-body{display:block;animation:fade .2s}
.action{font-size:13.5px;line-height:1.45;color:var(--muted);margin:12px 0 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--outline);border-radius:24px;overflow:hidden;margin-bottom:14px}
.seg button{height:44px;border:0;background:transparent;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;border-right:1px solid var(--outline)}
.seg button:last-child{border-right:0}
.seg button .ms{font-size:18px}
.seg button.sel.done{background:var(--ok-soft);color:var(--ok)}
.seg button.sel.missed{background:var(--bad-soft);color:var(--bad)}
.seg button.sel.na{background:var(--na-soft);color:var(--na)}
.seg button:disabled{cursor:default}
.proof-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin:4px 0 8px}
.proof-hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph .del .ms{font-size:18px}
.ph.add{border:1.5px dashed var(--outline);background:transparent;flex-direction:column;gap:4px;color:var(--red);font-size:11.5px;font-weight:500;display:flex;align-items:center;justify-content:center}
.ph.add .ms{font-size:26px}
.spin{width:24px;height:24px;border:3px solid var(--outline);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.save-state{font-size:12px;color:var(--muted);text-align:right;margin-top:10px;min-height:16px}
.save-state.err{color:var(--bad);cursor:pointer}

/* ---------- Lists / tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .k .ms{font-size:18px}
.tile .v{font-size:26px;font-weight:700;margin-top:6px}
.li{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;position:relative;overflow:hidden;border-bottom:1px solid var(--outline)}
.li:last-child{border-bottom:0}
.list{padding:0;overflow:hidden}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-weight:700;flex:none}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.tabs{display:flex;background:var(--surface2);border-radius:24px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;height:38px;border:0;border-radius:20px;background:none;font-weight:500;font-size:13.5px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar input{flex:1;border:1.5px solid var(--outline);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
.datebar .iconbtn{background:var(--surface);box-shadow:var(--shadow);color:var(--text)}
.pend{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pend span{font-size:11px;font-weight:500;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 7px}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12.5px}
.hbar .lbl{width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .trk{flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex}
.trend{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;justify-content:flex-end}
.trend b{display:block;width:100%;background:var(--red);border-radius:6px 6px 2px 2px;min-height:3px}
.dots{display:flex;gap:6px;margin-top:10px}
.dots div{flex:1;text-align:center;font-size:10.5px;color:var(--muted)}
.dots i{display:block;height:28px;border-radius:8px;margin-bottom:4px;background:var(--surface2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ms{font-size:48px;opacity:.5;display:block;margin:0 auto 8px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--outline);border-radius:14px;transition:.2s;cursor:pointer}
.switch span:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--red)}
.switch input:checked+span:before{transform:translateX(18px)}

/* ---------- Login ---------- */
#login{min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.login-hero{background:linear-gradient(160deg,#000 0%,#1c1c1f 55%,#CC0000 160%);color:#fff;padding:56px 24px 64px;position:relative;overflow:hidden}
.login-hero:after{content:'';position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border:28px solid rgba(204,0,0,.35);border-radius:50%}
.login-hero .logo{width:60px;height:60px;border-radius:18px;background:var(--red);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 6px 18px rgba(204,0,0,.5)}
.login-hero .logo .ms{font-size:34px}
.login-hero h1{margin:0;font-size:26px;font-weight:700}
.login-hero p{margin:6px 0 0;opacity:.75;font-size:14px}
.login-card{margin:-32px 16px 24px;position:relative;z-index:2;padding:22px 18px}
.pw-wrap{position:relative}
.pw-wrap .iconbtn{position:absolute;right:2px;top:2px;color:var(--muted)}

/* ---------- Sheet / dialog / snackbar ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet .handle{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:4px auto 14px}
.sheet h3{margin:0 0 6px;font-size:20px;font-weight:500}
.errlist{margin:10px 0;padding:0;list-style:none}
.errlist li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);margin-bottom:6px;font-size:13.5px;cursor:pointer}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface2);margin:12px 0;font-size:13.5px;line-height:1.4;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none;margin:0}
.snack{position:fixed;left:50%;bottom:calc(var(--nav) + 18px);transform:translate(-50%,30px);background:#2b2b2f;color:#fff;padding:13px 18px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;max-width:calc(100% - 32px);width:max-content;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.snack.on{opacity:1;transform:translate(-50%,0)}
.lightbox{position:fixed;inset:0;background:#000;z-index:70;display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.lightbox .iconbtn{position:absolute;top:10px;right:10px;color:#fff;background:rgba(255,255,255,.12)}
.splash{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;color:#fff}
.splash .logo{width:72px;height:72px;border-radius:22px;background:var(--red);display:grid;place-items:center}
.splash .logo .ms{font-size:42px}
.brand-word{display:inline-block;font-weight:700;letter-spacing:3px;font-size:13px;color:#fff;background:var(--red);padding:4px 10px;border-radius:6px;margin-bottom:8px}
.logo.img{background:#fff;padding:6px}.logo.img img{width:100%;height:100%;object-fit:contain}
.ph.add.cam-only{grid-column:span 2;aspect-ratio:auto;min-height:88px;flex-direction:row;gap:8px;font-size:13.5px}
</style>
</head>
<body>

<div class="splash" id="splash"><div class="logo"><span class="ms f">fact_check</span></div><div style="text-align:center"><div class="brand-word">TANSI HONDA</div><div style="font-weight:500;letter-spacing:.3px;opacity:.8;margin-top:4px">Sales Manager Checklist</div></div><div class="spin" style="border-color:#333;border-top-color:#CC0000"></div></div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="login-hero">
    <div class="logo" id="loginLogo"><span class="ms f">fact_check</span></div>
    <div class="brand-word" id="loginCompany">TANSI HONDA</div>
    <h1 id="loginApp">Sales Manager Checklist</h1>
    <p id="loginCampaign">Daily sales &amp; operational control</p>
  </div>
  <form class="card login-card" id="loginForm" autocomplete="on">
    <div class="field"><label>Email ID</label><input id="lgEmail" type="email" inputmode="email" autocomplete="username" placeholder="you@company.com" required></div>
    <div class="field"><label>Password</label>
      <div class="pw-wrap"><input id="lgPw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="button" class="iconbtn" id="pwEye"><span class="ms">visibility</span></button></div></div>
    <button class="btn pri block" id="lgBtn" type="submit"><span class="ms">login</span>Sign in</button>
    <p class="small muted" style="text-align:center;margin:14px 0 0">Forgot password? Ask your admin to reset it.</p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="appbar">
    <button class="iconbtn hidden" id="backBtn"><span class="ms">arrow_back</span></button>
    <div class="title"><div class="t1" id="barTitle">Today</div><div class="t2" id="barSub"></div></div>
    <button class="iconbtn" id="refreshBtn" title="Refresh"><span class="ms">refresh</span></button>
  </header>
  <div class="redline"></div>
  <div class="progress" id="progress"></div>
  <main id="main"></main>
  <button class="fab hidden" id="fab"></button>
  <nav class="nav" id="nav"></nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
<div class="snack" id="snack"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galIn" accept="image/*" class="hidden">

<script>
/* =================== STATE & UTILS =================== */
var S = { token:null, user:null, master:[], config:{}, today:'', view:'', params:{}, cl:null, img:{}, saving:{}, dirty:{}, timers:{}, openItem:null, loc:null, uploadNo:null, uploading:{}, dashTab:'day', mustChange:false };
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ic(n,f){return '<span class="ms'+(f?' f':'')+'">'+n+'</span>'}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function pd(n){return ('0'+n).slice(-2)}
function dObj(d){var p=d.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function fDate(d,long){if(!d)return'';return dObj(d).toLocaleDateString('en-IN',long?{weekday:'long',day:'numeric',month:'short',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}
function fTime(ts){if(!ts)return'';var t=String(ts).slice(11,16);if(!t)return'';var h=+t.slice(0,2),m=t.slice(3);return (h%12||12)+':'+m+' '+(h<12?'AM':'PM')}
function shift(d,n){var x=dObj(d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pd(x.getMonth()+1)+'-'+pd(x.getDate())}
function initials(n){return String(n||'?').replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||'?'}
function statusChip(s){
  if(s==='SUBMITTED')return '<span class="chip c-ok">'+ic('task_alt',1)+'Submitted</span>';
  if(s==='DRAFT')return '<span class="chip c-warn">'+ic('edit_note')+'In progress</span>';
  return '<span class="chip c-na">'+ic('schedule')+'Not started</span>';
}

function call(action,payload,quiet){
  return new Promise(function(res,rej){
    if(!quiet)busy(1);
    google.script.run.withSuccessHandler(function(r){
      if(!quiet)busy(-1);
      if(r&&r.ok)return res(r.data);
      var e=(r&&r.error)||'Something went wrong';
      if(e==='AUTH'){expired();return rej(new Error('Session expired – please sign in again'))}
      rej(new Error(e));
    }).withFailureHandler(function(e){
      if(!quiet)busy(-1);rej(new Error((e&&e.message)||'Network problem – check internet and retry'));
    }).api(action,S.token,payload||{});
  });
}

  if(S.loc&&Date.now()-S.loc.t<120000)return;
  try{navigator.geolocation.getCurrentPosition(function(p){S.loc={lat:p.coords.latitude.toFixed(5),lng:p.coords.longitude.toFixed(5),t:Date.now()}},function(){},{enableHighAccuracy:true,timeout:6000,maximumAge:60000})}catch(e){}
}
/* SHA-256 of the ORIGINAL file, so the same picture can never be uploaded twice */
function fileHash(file){
  return file.arrayBuffer().then(function(buf){
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest)return crypto.subtle.digest('SHA-256',buf).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')});
    var a=new Uint8Array(buf),h1=0x811c9dc5,h2=0x01000193^a.length,h3=0x9e3779b9,h4=0x85ebca6b;
    for(var i=0;i<a.length;i++){h1=Math.imul(h1^a[i],16777619);h2=Math.imul(h2^a[i],2246822507);h3=Math.imul(h3+a[i],3266489909);h4=Math.imul(h4^a[i],668265263)}
    return [h1,h2,h3,h4].map(function(x){return ('0000000'+(x>>>0).toString(16)).slice(-8)}).join('')+a.length.toString(16);
  });
}
function handlePhoto(no,file,source){
  var it=S.master.filter(function(m){return m.no===no})[0];
  source=source||S.uploadSrc||'gallery';
  if(it.proofSource==='CAMERA'){
    if(source!=='camera'){snack('Item #'+no+' needs a live camera photo');return}
    var age=(Date.now()-(file.lastModified||Date.now()))/60000;
    if(age>15){snack('That photo is '+Math.round(age)+' minutes old. Please take a fresh photo.',4000);return}
  }
  S.uploading[no]=(S.uploading[no]||0)+1;$('#ph'+no).innerHTML=photosHtml(no);
  var hash;
  fileHash(file).then(function(h){hash=h;return stampImage(file,it)}).then(function(dataUrl){
    return call('uploadProof',{date:S.cl.date,itemNo:no,dataUrl:dataUrl,lat:S.loc?S.loc.lat:'',lng:S.loc?S.loc.lng:'',hash:hash,source:source,capturedAt:file.lastModified||Date.now()},true).then(function(r){
      S.img[r.id]=dataUrl;(S.cl.proofs[no]=S.cl.proofs[no]||[]).push({id:r.id,uploadedAt:r.uploadedAt});
      applySummary(r);snack('Photo saved');
    });
  }).catch(function(e){snack(e.message||'Upload failed')}).then(function(){
    S.uploading[no]=Math.max(0,(S.uploading[no]||1)-1);rerenderItem(no,true);
  });
}
function stampImage(file,it){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),img=new Image();
    img.onerror=function(){rej(new Error('Could not read this image'))};
    img.onload=function(){
      var max=1024,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;var x=cv.getContext('2d');x.drawImage(img,0,0,w,h);
      var band=Math.max(52,Math.round(h*.085)),fs=Math.round(band*.3);
      x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,h-band,w,band);x.fillStyle='#CC0000';x.fillRect(0,h-band,Math.max(6,w*.008),band);
      x.fillStyle='#fff';x.font='500 '+fs+'px Roboto,Arial';x.textBaseline='middle';
      var now=new Date(),ts=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
      x.fillText((ts+'  •  '+(S.info&&S.info.company?S.info.company+' ':'')+S.user.branch).slice(0,70),fs*1.1,h-band*0.68);
      x.font=fs*.9+'px Roboto,Arial';
      x.fillText(('#'+it.no+' '+it.pillar+'  •  '+(S.loc?'📍 '+S.loc.lat+', '+S.loc.lng:'Location not available')).slice(0,80),fs*1.1,h-band*0.3);
      URL.revokeObjectURL(u);res(cv.toDataURL('image/jpeg',.7));
    };
    img.src=u;
  });
}

/* ---------- validate / submit ---------- */
function clientErrors(){
  var c=S.cl,e=[];
  S.master.forEach(function(i){
    var l=c.lines[i.no]||{};
    if(!l.status){e.push({no:i.no,msg:'Mark Done / Missed / N/A'});return}
    if(l.status==='DONE'){
      i.metrics.forEach(function(m){if(!String((l.metrics||{})[m.key]||'').trim())e.push({no:i.no,msg:'Fill “'+m.label+'”'})});
      if(i.proofRequired&&(c.proofs[i.no]||[]).length<i.minPhotos)e.push({no:i.no,msg:'Add '+i.minPhotos+' proof photo'+(i.minPhotos>1?'s':'')});
    }else if(!String(l.remarks||'').trim())e.push({no:i.no,msg:'Give the reason for '+(l.status==='NA'?'N/A':'Missed')});
  });
  return e;
}
function errHtml(errs){return '<ul class="errlist">'+errs.map(function(e){return '<li onclick="jumpTo('+e.no+')">'+ic('error')+'<div class="grow">'+(e.no?'<b>#'+e.no+'</b> ':'')+esc(e.msg)+'</div>'+(e.no?ic('chevron_right'):'')+'</li>'}).join('')+'</ul>'}

/* ---------- WhatsApp report ---------- */
function buildReport(){
  var c=S.cl,k=counts(),L=[];
  L.push('*'+((S.info&&S.info.company)||'Tansi Honda')+' – Sales Manager Daily Checklist*');
  if(S.config.CAMPAIGN_NAME)L.push('_'+S.config.CAMPAIGN_NAME+'_');
  L.push('');L.push('🏢 Branch: '+c.owner.branch);L.push('👤 Manager: '+c.owner.name);L.push('📅 Date: '+fDate(c.date,1));
  L.push('📊 Score: '+k.score+'%  (✅ '+k.done+'  ❌ '+k.missed+'  ➖ '+k.na+'  ⏳ '+(S.master.length-k.ans)+')');L.push('');
  S.master.forEach(function(i){
    var l=c.lines[i.no]||{},em=l.status==='DONE'?'✅':l.status==='MISSED'?'❌':l.status==='NA'?'➖':'⏳';
    var det=i.metrics.map(function(m){var v=(l.metrics||{})[m.key];return v?m.label+': '+v:''}).filter(String).join(', ');
    var line=em+' '+i.no+'. '+i.pillar;
    if(l.status==='DONE'&&det)line+=' — '+det;
    if((l.status==='MISSED'||l.status==='NA')&&l.remarks)line+=' — Reason: '+l.remarks;
    L.push(line);
  });
  L.push('');L.push('Report time: '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}));
  return L.join('\n');
}
function shareReport(){
  var c=S.cl;
  // auto-fill the time on the "evening report" item (metric of type time)
  if(c.editable){S.master.forEach(function(i){i.metrics.forEach(function(m){if(m.type==='time'){var l=lineOf(i.no);if(!(l.metrics||{})[m.key]){var d=new Date();l.metrics=l.metrics||{};l.metrics[m.key]=pd(d.getHours())+':'+pd(d.getMinutes());if(!l.status)l.status='DONE';rerenderItem(i.no);saveLine(i.no)}}})})}
  var ph=String(S.config.ADMIN_WHATSAPP||'').replace(/\D/g,'');if(ph.length===10)ph='91'+ph;
  openExt('https://wa.me/'+(ph||'')+'?text='+encodeURIComponent(buildReport()));
}

    '<div class="field"><label>Mobile (WhatsApp)</label><input id="uPhone" type="tel" inputmode="numeric" value="'+esc(u.phone)+'" placeholder="98xxxxxxxx"></div></div>'+
    '<div class="field"><label>Branch (required for managers)</label><input id="uBranch" value="'+esc(u.branch==='ALL'?'':u.branch)+'" placeholder="e.g. FILL IN branch name"></div>'+
    '<div class="field"><label>'+(isNew?'Password (blank = Change@123)':'New password (leave blank to keep)')+'</label><input id="uPw" type="text" autocomplete="off"></div>'+
    '<label class="check" style="align-items:center"><span class="grow">Active (can log in)</span><span class="switch"><input type="checkbox" id="uActive" '+(u.active?'checked':'')+' '+(self?'disabled':'')+'><span></span></span></label>'+
    '<button class="btn pri block" id="uSave">'+ic('save',1)+'Save</button>'+
    (isNew?'':'<div style="height:8px"></div><div class="grid2"><button class="btn out" id="uReset">'+ic('lock_reset')+'Reset password</button><button class="btn out" style="color:var(--bad)" id="uDel" '+(self?'disabled':'')+'>'+ic('delete')+'Delete</button></div>'));
  $('#uSave').onclick=function(){
    var b=this;b.disabled=true;
    call('saveUser',{originalEmail:isNew?'':u.email,email:$('#uEmail').value,name:$('#uName').value,branch:$('#uBranch').value,role:$('#uRole').value,phone:$('#uPhone').value,password:$('#uPw').value,active:$('#uActive').checked})
      .then(function(r){closeSheet();snack(r.created?'User added. First password: '+r.password:'User updated',4500);vUsers()}).catch(function(e){snack(e.message);b.disabled=false});
  };
  if(!isNew){
    $('#uReset').onclick=function(){confirmSheet('Reset password?',esc(u.name)+' will log in with Change@123 and must set a new password.','Reset',function(){call('resetPassword',{email:u.email}).then(function(r){snack('Password reset to '+r.defaultPassword,4000)}).catch(function(e){snack(e.message)})})};
    $('#uDel').onclick=function(){confirmSheet('Delete '+esc(u.name)+'?','The user will not be able to log in. Past checklists and photos stay saved in Google Sheets.','Delete',function(){call('deleteUser',{email:u.email}).then(function(){snack('User deleted');vUsers()}).catch(function(e){snack(e.message)})})};
  }
}

/* =================== PROFILE =================== */
function vProfile(){
  setBar('Profile','');var u=S.user;
  $('#main').innerHTML='<div class="card" style="text-align:center;padding:26px 16px"><div class="avatar" style="width:72px;height:72px;font-size:26px;margin:0 auto 12px;background:var(--red);color:#fff">'+initials(u.name)+'</div><h2 style="margin:0;font-weight:500">'+esc(u.name)+'</h2><div class="muted">'+esc(u.email)+'</div><div class="chips" style="justify-content:center"><span class="chip c-red">'+(u.role==='ADMIN'?'Admin':u.role==='VIEWER'?'GM / Viewer':'Sales Manager')+'</span>'+(u.branch&&u.branch!=='ALL'?'<span class="chip c-na">'+esc(u.branch)+'</span>':'')+'</div></div>'+
    '<div class="card list"><div class="li" onclick="passwordSheet(false)">'+ic('key')+'<div class="grow">Change password</div>'+ic('chevron_right')+'</div><div class="li" onclick="logout()" style="color:var(--bad)">'+ic('logout')+'<div class="grow">Sign out</div></div></div>'+
    '<p class="small muted" style="text-align:center">'+esc(((S.info&&S.info.company)||'')+' · '+(S.config.CAMPAIGN_NAME||''))+(S.cutoff?'<br>Daily cut-off: '+esc(S.cutoff):'')+'<br>Data is saved in Google Sheets · Photos in Google Drive</p>';
}
function passwordSheet(forced){
  openSheet('<h3>'+(forced?'Set your own password':'Change password')+'</h3>'+(forced?'<p class="muted small">For security, change the default password before you continue.</p>':'')+
    '<div class="field"><label>Current password</label><input id="pOld" type="password" '+(forced?'value="Change@123"':'')+'></div><div class="field"><label>New password (min 6)</label><input id="pNew" type="password"></div><div class="field"><label>Confirm new password</label><input id="pNew2" type="password"></div><button class="btn pri block" id="pSave">'+ic('key')+'Update password</button>',forced);
  $('#pSave').onclick=function(){
    if($('#pNew').value!==$('#pNew2').value){snack('New passwords do not match');return}
    var b=this;b.disabled=true;
    call('changePassword',{oldPassword:$('#pOld').value,newPassword:$('#pNew').value}).then(function(){S.mustChange=false;S.sheetLocked=false;closeSheet();snack('Password updated')}).catch(function(e){snack(e.message);b.disabled=false});
  };
}

/* =================== SHEETS =================== */
function openSheet(html,locked){S.sheetLocked=!!locked;$('#sheetBody').innerHTML=html;$('#scrim').classList.add('on');$('#sheet').classList.add('on')}
function closeSheet(){if(S.sheetLocked)return;$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
$('#scrim').onclick=closeSheet;
function confirmSheet(t,msg,okLbl,fn){openSheet('<h3>'+t+'</h3><p class="muted">'+msg+'</p><div class="grid2"><button class="btn out" onclick="closeSheet()">Cancel</button><button class="btn pri" id="cfOk">'+okLbl+'</button></div>');$('#cfOk').onclick=function(){closeSheet();fn()}}

/* =================== START =================== */
(function(){
  call('publicInfo',{},true).then(applyInfo).catch(function(){});
  S.token=ls('tsm_token');
  if(!S.token){setTimeout(showLogin,300);return}
  boot().catch(function(){S.token=null;ls('tsm_token',null);showLogin()});
})();
</script>
